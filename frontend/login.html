<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Career Platform</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-theme="dark">
    <div class="bg-glows"></div>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h1>AI Career Hub</h1>
                <p>Welcome back! Sign in to optimize your profile.</p>
            </div>
            
            <div id="auth-alert" class="alert"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="/signup.html">Create one</a>
            </div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
