<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI Career Platform</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-theme="dark">
    <div class="bg-glows"></div>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <h1>AI Career Hub</h1>
                <p>Register now to analyze your resume and generate dynamic portfolios.</p>
            </div>
            
            <div id="auth-alert" class="alert"></div>
            
            <form id="signup-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="•••••••• (Min 6 chars)" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
            
            <div class="auth-footer">
                Already have an account? <a href="/login.html">Sign in</a>
            </div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
